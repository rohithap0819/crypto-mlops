services:

  # ==========================================================
  # 1. BINANCE LIVE INGESTION
  # ==========================================================

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: crypto-mlops-ingestion

    command:
      [
        "python",
        "src/ingestion/binance_ws_ingestor.py"
      ]

    restart: unless-stopped

    volumes:
      - live_db:/app/data

    environment:
      PYTHONUNBUFFERED: "1"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sqlite3; c=sqlite3.connect('/app/data/crypto_live.db', timeout=5); c.execute('SELECT COUNT(*) FROM market_klines_1m').fetchone(); c.close()"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

    networks:
      - crypto-mlops


  # ==========================================================
  # 2. RESIDENT INFERENCE + MONITORING
  # ==========================================================

  inference:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: crypto-mlops-inference

    command:
      [
        "python",
        "src/inference/resident_inference_service.py"
      ]

    restart: unless-stopped

    depends_on:
      ingestion:
        condition: service_healthy

    volumes:
      - live_db:/app/data
      - ./data/processed:/app/data/processed:ro
      - ./models:/app/models
      - ./reports:/app/reports

    environment:
      PYTHONUNBUFFERED: "1"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sqlite3; c=sqlite3.connect('/app/data/crypto_live.db', timeout=5); c.execute('SELECT COUNT(*) FROM monitoring_metrics').fetchone(); c.close()"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - crypto-mlops


  # ==========================================================
  # 3. FASTAPI
  # ==========================================================

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: crypto-mlops-api

    command:
      [
        "uvicorn",
        "src.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    restart: unless-stopped

    depends_on:
      inference:
        condition: service_healthy

    volumes:
      - live_db:/app/data
      - ./models:/app/models

    environment:
      PYTHONUNBUFFERED: "1"

    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/monitoring/latest', timeout=5); assert r.status == 200"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - crypto-mlops


  # ==========================================================
  # 4. STREAMLIT DASHBOARD
  # ==========================================================

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: crypto-mlops-dashboard

    command:
      [
        "streamlit",
        "run",
        "src/dashboard/app.py",
        "--server.address",
        "0.0.0.0",
        "--server.port",
        "8501",
        "--server.headless",
        "true"
      ]

    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    environment:
      PYTHONUNBUFFERED: "1"
      CRYPTO_API_URL: "http://api:8000"

    ports:
      - "8501:8501"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5); assert r.status == 200"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - crypto-mlops




  # ==========================================================
  # 5. PROMETHEUS
  # ==========================================================

  prometheus:
    image: prom/prometheus:latest

    container_name: crypto-mlops-prometheus

    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    ports:
      - "9090:9090"

    networks:
      - crypto-mlops


  # ==========================================================
  # 6. GRAFANA
  # ==========================================================

  grafana:
    image: grafana/grafana:latest

    container_name: crypto-mlops-grafana

    restart: unless-stopped

    depends_on:
      prometheus:
        condition: service_started

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    ports:
      - "3000:3000"

    networks:
      - crypto-mlops

# ============================================================
# NETWORK
# ============================================================

networks:

  crypto-mlops:
    driver: bridge


# ============================================================
# VOLUMES
# ============================================================

volumes:

  live_db:
    name: crypto-mlops-live-db
    external: true

  prometheus_data:
    name: crypto-mlops-prometheus-data

  grafana_data:
    name: crypto-mlops-grafana-data