services:

  # ==========================================================
  # 1. BINANCE LIVE INGESTION
  # ==========================================================

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: crypto-mlops-ingestion

    command:
      [
        "python",
        "src/ingestion/binance_ws_ingestor.py"
      ]

    restart: unless-stopped

    volumes:
      - ./data:/app/data

    environment:
      PYTHONUNBUFFERED: "1"

    networks:
      - crypto-mlops


  # ==========================================================
  # 2. RESIDENT INFERENCE + MONITORING
  # ==========================================================

  inference:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: crypto-mlops-inference

    command:
      [
        "python",
        "src/inference/resident_inference_service.py"
      ]

    restart: unless-stopped

    depends_on:
      - ingestion

    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports

    environment:
      PYTHONUNBUFFERED: "1"

    networks:
      - crypto-mlops


  # ==========================================================
  # 3. FASTAPI
  # ==========================================================

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: crypto-mlops-api

    command:
      [
        "uvicorn",
        "src.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    restart: unless-stopped

    volumes:
      - ./data:/app/data
      - ./models:/app/models

    environment:
      PYTHONUNBUFFERED: "1"

    ports:
      - "8000:8000"

    networks:
      - crypto-mlops


  # ==========================================================
  # 4. STREAMLIT DASHBOARD
  # ==========================================================

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: crypto-mlops-dashboard

    command:
      [
        "streamlit",
        "run",
        "src/dashboard/app.py",
        "--server.address",
        "0.0.0.0",
        "--server.port",
        "8501",
        "--server.headless",
        "true"
      ]

    restart: unless-stopped

    depends_on:
      - api

    environment:
      PYTHONUNBUFFERED: "1"
      CRYPTO_API_URL: "http://api:8000"

    ports:
      - "8501:8501"

    networks:
      - crypto-mlops


# ============================================================
# NETWORK
# ============================================================

networks:

  crypto-mlops:
    driver: bridge